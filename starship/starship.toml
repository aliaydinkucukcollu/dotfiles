# -----------------------------------------------------------------------------
# Starship configuration for C++ / ROS2 / Docker / Git development
# -----------------------------------------------------------------------------

# Use a two-line prompt.
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
${custom.ros}\
$git_state\
$docker_context\
$cmake\
$cpp\
$python\
$cmd_duration\
$line_break\
$character
"""

# -----------------------------------------------------------------------------
# Prompt character
# -----------------------------------------------------------------------------

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# -----------------------------------------------------------------------------
# Directory
# -----------------------------------------------------------------------------

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"
style = "bold cyan"

# -----------------------------------------------------------------------------
# Git
# -----------------------------------------------------------------------------

[git_branch]
symbol = "🌿 "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "

conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

# -----------------------------------------------------------------------------
# Docker
# -----------------------------------------------------------------------------

[docker_context]
symbol = "🐳 "
style = "blue"
format = "[$symbol$context]($style) "

# -----------------------------------------------------------------------------
# CMake
# -----------------------------------------------------------------------------

[cmake]
symbol = "⚙️ "
style = "yellow"
format = "[$symbol$version]($style) "

# -----------------------------------------------------------------------------
# C++
# -----------------------------------------------------------------------------

[cpp]
symbol = "C++ "
style = "blue"
format = "[$symbol]($style)"

# -----------------------------------------------------------------------------
# Python (used by ROS2 tooling)
# -----------------------------------------------------------------------------

[python]
symbol = "🐍 "
style = "green"
python_binary = ["python3"]
format = "[$symbol${pyenv_prefix}(${version})]($style) "

# -----------------------------------------------------------------------------
# Command duration
# -----------------------------------------------------------------------------

[cmd_duration]
min_time = 1000
format = "[⏱ $duration](yellow) "

# -----------------------------------------------------------------------------
# Exit status
# -----------------------------------------------------------------------------

[status]
disabled = false
symbol = "❌"
format = "[$symbol $status](bold red) "

# -----------------------------------------------------------------------------
# Time
# -----------------------------------------------------------------------------

[time]
disabled = false
time_format = "%H:%M"
format = "[🕒 $time](bright-black) "

# -----------------------------------------------------------------------------
# Username & hostname
# -----------------------------------------------------------------------------

[username]
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname](bold green) "

# -----------------------------------------------------------------------------
# Disable modules you probably don't need
# -----------------------------------------------------------------------------

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[package]
disabled = true

# -----------------------------------------------------------------------------
# ROS2
# -----------------------------------------------------------------------------

[custom.ros]
command = "printf '%s' \"$ROS_DISTRO\""
when = "test -n \"$ROS_DISTRO\""
symbol = "🤖 "
style = "bold magenta"
format = "[$symbol$output]($style) "
